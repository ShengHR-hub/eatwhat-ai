<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>布局 E · 卡片网格（雷达版）· 食刻 EatWhat 后台</title>
<link rel="stylesheet" href="base.css" />
<style>
  /* 变体 E：卡片网格。每张卡顶部放八维雷达，缺维度直接标红。 */
  :root {
    --font-cjk: "Source Han Sans CN", "Source Han Sans SC", "Microsoft YaHei UI";
    --body-size: 14px; --body-lh: 1.66;
  }
  .toolbar2 { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .chipfilters { display: flex; gap: 7px; flex-wrap: wrap; }
  .chipf {
    height: 30px; padding: 0 13px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); background: var(--paper-strong); color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .15s ease, background .15s ease;
  }
  .chipf:hover { border-color: var(--line-strong); }
  .chipf.is-on { background: var(--ink); color: var(--paper-strong); border-color: var(--ink); }
  .chipf i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .55; }
  .toolbar2 .btn { margin-left: auto; }

  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }

  /* ── 卡片本体：三层质感（描边 + 内高光 + 外投影）────────────── */
  .card {
    position: relative;
    background: linear-gradient(180deg, #fffdf8 0%, #fbf8f2 100%);
    border: 1px solid rgba(36, 30, 24, .1);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 1px 2px rgba(38, 31, 23, .05);
    display: flex; flex-direction: column;
    transition: transform .18s cubic-bezier(.32,.72,0,1), box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: rgba(36, 30, 24, .17);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .95), 0 10px 26px rgba(38, 31, 23, .1);
  }
  /* 有问题的那几张：左侧一道细色条，不靠大红大绿喊人 */
  .card[data-tone="warn"]::before,
  .card[data-tone="bad"]::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; z-index: 2;
  }
  .card[data-tone="warn"]::before { background: var(--warn); opacity: .55; }
  .card[data-tone="bad"]::before { background: var(--bad); opacity: .55; }

  .card__viz {
    position: relative; height: 140px;
    display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.9), rgba(244,241,234,.5) 70%);
    border-bottom: 1px solid rgba(36, 30, 24, .07);
  }
  .card__viz svg { width: 138px; height: 138px; display: block; overflow: visible; }
  .card__status { position: absolute; top: 9px; right: 9px; }
  .card__flag {
    position: absolute; left: 11px; bottom: 8px;
    font-size: 9.5px; letter-spacing: .02em; color: var(--faint);
  }
  .card__flag.is-bad { color: var(--bad); }

  .card__body { padding: 12px 13px 13px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .card__name { font-size: 13.5px; font-weight: 500; letter-spacing: -.005em; }
  .card__meta { font-size: 10.5px; color: var(--faint); line-height: 1.5; }
  .card__row { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
  .card__price { font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .card__ops { display: flex; gap: 9px; }
  .card__ops button { font-size: 10.5px; color: var(--faint); transition: color .13s ease; }
  .card__ops button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .card__ops button.is-danger:hover { color: var(--bad); }

  .gridfoot { display: flex; align-items: center; gap: 12px; margin-top: 18px; font-size: 11.5px; color: var(--muted); }
  .gridfoot .pager { margin-left: auto; }

  /* 图例：解释雷达怎么读，避免第一次看不知道红点是什么 */
  .legend { display: flex; align-items: center; gap: 14px; font-size: 10.5px; color: var(--faint); margin-left: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .legend .dot-miss { background: var(--bad); }
  .legend .dot-ok { background: var(--accent); opacity: .55; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand__mark">食</span>
      <span class="brand__copy"><span class="brand__name">食刻 EatWhat</span><span class="brand__sub">Admin Console</span></span>
    </div>
    <nav class="nav">
      <p class="nav__label">数据</p>
      <button class="nav__item is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h10"/></svg>数据管理</button>
      <button class="nav__item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 5h9M9 12h9M9 19h9M4 5h1M4 12h1M4 19h1"/></svg>审计日志</button>
      <p class="nav__label">分析</p>
      <button class="nav__item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/></svg>实验大屏</button>
    </nav>
    <div class="sidebar__foot">
      <div class="who">
        <span class="who__avatar">测</span>
        <span class="who__copy"><span class="who__name">测试账号</span><span class="who__role">ADMIN</span></span>
      </div>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="crumb"><span>后台</span><span>/</span><b>数据管理 · 卡片网格</b></div>
      <div class="search" style="margin-left:auto">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input placeholder="搜菜品名、门店名或 ID" />
      </div>
    </header>

    <div class="page" style="padding-bottom:26px">
      <div class="page-head" style="margin-bottom:14px">
        <div><h1>菜品库</h1><p>6,560 道菜 · 雷达缺口 = 该维度缺值，点卡片进去补。</p></div>
        <div class="page-head__actions">
          <button class="btn">导出</button>
          <button class="btn btn--primary">新增菜品</button>
        </div>
      </div>

      <div class="toolbar2">
        <div class="chipfilters">
          <button class="chipf is-on"><i></i>全部 6,560</button>
          <button class="chipf"><i></i>思源 3,862</button>
          <button class="chipf"><i></i>建大 3,842</button>
          <button class="chipf"><i></i>外食 120</button>
          <button class="chipf"><i></i>下厨 6,440</button>
          <button class="chipf"><i></i>缺维度 24</button>
        </div>
        <div class="legend">
          <span><i class="dot-ok"></i>已填</span>
          <span><i class="dot-miss"></i>缺值</span>
        </div>
        <button class="btn btn--sm">排序：缺口优先 ▾</button>
      </div>

      <div class="grid" id="grid"></div>

      <div class="gridfoot">
        <span>共 6,560 道 · 每页 12 · 第 1 / 547 页</span>
        <div class="pager">
          <button disabled>上一页</button><button class="is-active">1</button><button>2</button><button>3</button><button>下一页</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const AXES = ['酸', '甜', '苦', '辣', '咸', '鲜', '油', '烫'];

  // 数据：null 表示该维度缺值。真实待打标的菜里，最常见的是「烫 / 油」这类口感维度缺失。
  const DISHES = [
    { name: '砂锅豆腐', meta: '教工食堂 · 砂锅炖菜 · 思源', price: '¥22', status: 'SUCCESS',
      vec: [.3, .2, .1, .2, .6, .7, .4, .8] },
    { name: '红烧牛肉面', meta: '二食堂 · 牛肉面 · 思源', price: '¥18', status: 'SUCCESS',
      vec: [.2, .3, .1, .2, .7, .7, .5, .7] },
    { name: '麻辣香锅', meta: '一食堂 · 川湘窗口 · 思源', price: '¥32', status: 'SUCCESS',
      vec: [.4, .2, .1, .9, .7, .6, .8, .6] },
    { name: '孜然木耳黄瓜', meta: '三食堂 · 凉菜窗口 · 建大', price: '¥12', status: 'PENDING',
      vec: [.6, .2, .2, .2, .5, .4, .2, null] },
    { name: '番茄鸡蛋面', meta: '家常菜谱 · 下厨 · 15 分钟', price: '—', status: 'FAILED',
      vec: [.5, .4, .1, .1, .5, .6, .3, null] },
    { name: '蒜蓉西兰花', meta: '二食堂 · 素菜窗口 · 思源', price: '¥10', status: 'SUCCESS',
      vec: [.2, .2, .3, .1, .5, .5, .4, .6] },
    { name: '酸辣粉', meta: '一食堂 · 小吃窗口 · 思源', price: '¥9', status: 'PENDING',
      vec: [.8, .2, .1, .7, .6, .5, .5, null] },
    { name: '清蒸鲈鱼', meta: '教工食堂 · 蒸菜 · 建大', price: '¥38', status: 'SUCCESS',
      vec: [.1, .2, .1, .1, .6, .9, .2, .7] },
    { name: '蛋炒饭', meta: '二食堂 · 主食窗口 · 思源', price: '¥8', status: 'SUCCESS',
      vec: [.1, .2, .1, .1, .6, .5, .6, .5] },
    { name: '黄焖鸡米饭', meta: '一食堂 · 快餐 · 建大', price: '¥20', status: 'SUCCESS',
      vec: [.2, .3, .1, .4, .8, .6, .7, .7] },
    { name: '紫菜蛋花汤', meta: '三食堂 · 汤品 · 思源', price: '¥4', status: 'SUCCESS',
      vec: [.2, .1, .1, .1, .7, .5, .1, .9] },
    { name: '鸡胸肉沙拉', meta: '轻食窗口 · 建大 · 待补向量', price: '¥26', status: 'FAILED',
      vec: [.4, .2, .2, .1, .4, .4, null, null] }
  ];

  const TONE = { SUCCESS: 'ok', PENDING: 'warn', FAILED: 'bad' };

  function radarSVG(vec) {
    const S = 132, cx = 66, cy = 66, R = 45, LR = 61;
    const missing = vec.map((v, i) => (v == null ? i : -1)).filter((i) => i >= 0);
    const angle = (i) => (-Math.PI / 2) + (i * 2 * Math.PI) / 8;
    const pt = (i, ratio) => [
      cx + Math.cos(angle(i)) * R * ratio,
      cy + Math.sin(angle(i)) * R * ratio,
    ];
    const poly = (ratio) =>
      AXES.map((_, i) => pt(i, ratio).map((n) => n.toFixed(1)).join(',')).join(' ');

    let svg = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="八维风味雷达">`;
    [0.33, 0.66, 1].forEach((r, idx) => {
      svg += `<polygon points="${poly(r)}" fill="none" stroke="rgba(36,30,24,${idx === 2 ? .13 : .07})" stroke-width="1"/>`;
    });
    AXES.forEach((_, i) => {
      const [x, y] = pt(i, 1);
      const miss = missing.includes(i);
      svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"
        stroke="rgba(36,30,24,${miss ? .1 : .08})" stroke-width="1"
        ${miss ? 'stroke-dasharray="2 3"' : ''}/>`;
    });
    const pts = vec
      .map((v, i) => pt(i, v == null ? 0 : v).map((n) => n.toFixed(1)).join(','))
      .join(' ');
    svg += `<polygon points="${pts}" fill="rgba(184,92,46,.13)" stroke="rgba(184,92,46,.6)" stroke-width="1.4" stroke-linejoin="round"/>`;
    vec.forEach((v, i) => {
      if (v == null) return;
      const [x, y] = pt(i, v);
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.8" fill="#b85c2e"/>`;
    });
    missing.forEach((i) => {
      const [x, y] = pt(i, 0);
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#8c3a2a"/>`;
    });
    AXES.forEach((label, i) => {
      const [x, y] = pt(i, LR / R);
      const miss = missing.includes(i);
      svg += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle"
        font-size="9" fill="${miss ? '#8c3a2a' : '#8b8175'}" font-weight="${miss ? 600 : 400}">${label}</text>`;
    });
    svg += '</svg>';
    return { svg, missing };
  }

  document.getElementById('grid').innerHTML = DISHES.map((d) => {
    const { svg, missing } = radarSVG(d.vec);
    const flag = missing.length ? `缺 ${missing.map((i) => AXES[i]).join(' · ')}` : '8 维齐全';
    return `
      <article class="card" data-tone="${TONE[d.status]}">
        <div class="card__viz">
          ${svg}
          <span class="chip chip--${TONE[d.status]} card__status">${d.status}</span>
          <span class="card__flag ${missing.length ? 'is-bad' : ''}">${flag}</span>
        </div>
        <div class="card__body">
          <div class="card__name">${d.name}</div>
          <div class="card__meta">${d.meta}</div>
          <div class="card__row">
            <span class="card__price tabular">${d.price}</span>
            <span class="card__ops"><button>编辑</button><button class="is-danger">删除</button></span>
          </div>
        </div>
      </article>`;
  }).join('');
</script>
</body>
</html>
