<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>食刻 · V5 设计预览</title>
<style>
  :root { --bg:#e7e1d5; --paper:#f4f1ea; --ink:#1d1c19; --muted:#6e6256; --faint:#a39a8c; --line:rgba(29,28,25,.12); --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); }
  main { max-width:760px; margin:0 auto; padding:48px 24px 64px; }
  .eyebrow { margin:0 0 8px; font-size:10px; letter-spacing:.18em; color:var(--muted); }
  h1 { margin:0 0 10px; font-size:30px; font-weight:500; letter-spacing:-.04em; }
  .intro { margin:0 0 28px; font-size:13px; line-height:1.7; color:var(--muted); max-width:520px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  a { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 16px; border-radius:14px; background:var(--paper); border:1px solid var(--line); color:var(--ink); text-decoration:none; }
  a span:first-child { display:flex; flex-direction:column; gap:3px; }
  a b { font-size:13px; font-weight:500; }
  a small { font-size:10px; color:var(--faint); }
  a i { font-style:normal; font-size:16px; color:var(--faint); }
  a:active { opacity:.65; }
  .foot { margin-top:26px; padding-top:16px; border-top:1px solid var(--line); font-size:10px; line-height:1.7; color:var(--faint); }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } main { padding:32px 18px 48px; } }
</style>
</head>
